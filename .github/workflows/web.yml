# Builds the web releases for the customer app and the admin console.
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/admin/**'
      - 'packages/core/**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }} web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, admin]

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the web/ folder (index.html, manifest) for this app.
      - name: Ensure web platform files
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web release
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: fixindays-${{ matrix.app }}-web
          path: build/web
          retention-days: 30
