# Runs the shared core package's tests (models, logic, validators).
name: Core tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
  pull_request:
    paths:
      - 'packages/core/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
